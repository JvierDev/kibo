appId: io.github.jvierdev.kibo
productName: Kibo

artifactName: "${productName}-${version}-${arch}.${ext}"

directories:
  buildResources: build
  output: dist

files:
  - "out/**/*"
  - "build/kiboTemplate*.png"

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - universal

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

linux:
  icon: build/icon.png
  category: Utility
  target:
    - AppImage
    - deb
