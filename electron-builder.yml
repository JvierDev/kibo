appId: com.kibo.app
productName: kibo
directories:
  buildResources: build
files:
  - "out/**/*"
  - "build/kiboTemplate*.png"
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.gitignore,.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  - "!scripts/*"
  - "!build/icon-source.png"
  - "!build/icon.icns"
  - "!build/icon.png"
mac:
  category: public.app-category.productivity
  target:
    - dmg
win:
  target:
    - nsis
linux:
  target:
    - AppImage
    - deb
